name: Internship Job Alerts

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job monitor
        run: python monitor.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit updated seen jobs
        run: |
          git config user.name "internship-alert-bot"
          git config user.email "msanni15@users.noreply.github.com"
          git add seen_jobs.json daily_state.json
          git commit -m "Update seen jobs" || echo "No changes to commit"
          git push
name: Internship Job Alerts

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job monitor
        run: python monitor.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Check GitHub Actions usage
        run: python check_actions_usage.py
        continue-on-error: true
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit updated seen jobs
        run: |
          git config user.name "internship-alert-bot"
          git config user.email "msanni15@users.noreply.github.com"
          git add seen_jobs.json daily_state.json
          [ -f usage_alert_state.json ] && git add usage_alert_state.json
          [ -f company_health.json ] && git add company_health.json
          git commit -m "Update seen jobs" || echo "No changes to commit"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (another commit landed on main), rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done

          echo "Push still failing after 5 attempts."
          exit 1
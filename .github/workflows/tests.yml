name: Bot tests

# Run only when explicitly requested from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-browser.txt
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v

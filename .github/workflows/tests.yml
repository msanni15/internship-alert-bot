name: Bot tests

on:
  pull_request:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'companies*.csv'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'companies*.csv'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-browser.txt
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v
